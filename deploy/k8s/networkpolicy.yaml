# Default deny for the namespace, then allow only HTTP into the app pods.
# Egress stays denied: the app makes no outbound calls.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny
  namespace: app
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: classic-allow-http
  namespace: app
spec:
  podSelector:
    matchLabels:
      app: classic
  policyTypes: [Ingress]
  ingress:
    - ports:
        - port: 8080
          protocol: TCP
