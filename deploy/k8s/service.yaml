# Cluster-internal service. Expose it with your cloud's ingress or load
# balancer, and set that URL as STAGING_URL for the DAST stage (DSO-14).
apiVersion: v1
kind: Service
metadata:
  name: classic
  namespace: app
spec:
  selector:
    app: classic
  ports:
    - name: http
      port: 80
      targetPort: http
