# =============================================================================
#  GITLAB-ONLY: CI jobs injected by the pipeline execution policy.
#  These run in the reserved .pipeline-policy-pre stage of EVERY pipeline in
#  scope, before the project's own jobs. Project YAML cannot remove, skip or
#  override them; later stages wait for this stage to finish.
#  Job names carry a "policy:" prefix to avoid clashing with project jobs.
# =============================================================================

policy:gitleaks:
  stage: .pipeline-policy-pre
  image:
    name: ghcr.io/gitleaks/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f      # add @sha256 digest before use
    entrypoint: [""]                             # the image's ENTRYPOINT is gitleaks
  variables:
    GIT_DEPTH: "0"
  script:
    - git config --global --add safe.directory "$CI_PROJECT_DIR"
    - |
      if [ -n "$CI_MERGE_REQUEST_DIFF_BASE_SHA" ]; then RANGE="$CI_MERGE_REQUEST_DIFF_BASE_SHA..HEAD"; else RANGE="HEAD~1..HEAD"; fi
    - gitleaks git --log-opts="$RANGE" --redact --exit-code 1 --report-format junit --report-path gl-policy-gitleaks.xml .
  artifacts:
    when: always
    reports:
      junit: gl-policy-gitleaks.xml

# Runs only in projects that contain an AI app (app-ai/), so classic projects
# are not charged for model calls.
policy:ai-redteam-pr:
  stage: .pipeline-policy-pre
  image: node:22-bookworm-slim@sha256:e9f565d32859f0cbfb52125eafe8be39390f24dac302dc3cdf566e8ba3ab21ee                   # add @sha256 digest before use
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      exists: [app-ai/redteam-pr.yaml]
  secrets:
    TEST_MODEL_API_KEY:
      gitlab_secrets_manager:
        name: test-model-api-key
  script:
    - export MODEL_API_KEY="$(cat "$TEST_MODEL_API_KEY" 2>/dev/null || echo "$TEST_MODEL_API_KEY")"
    - npx --yes promptfoo@0.125.1 redteam run -c app-ai/redteam-pr.yaml --output gl-policy-redteam.json
  artifacts:
    when: always
    paths: [gl-policy-redteam.json]
